    <title>Música</title>
    <script type="module" crossorigin src="/assets/index-BDCC2Xme.js"></script>

  <link rel="manifest" href="/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .then((registration) => {
              // Chequear actualización inmediatamente al abrir
              registration.update().catch(() => {});
              
              // Chequear periódicamente cada 60 segundos
              setInterval(() => {
                registration.update().catch(() => {});
              }, 60000);
            })
            .catch((err) => {
              console.warn('Registro de ServiceWorker:', err);
            });
        });

        // Al volver a la app en el teléfono, verificar inmediatamente si hay versión nueva
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible') {
            navigator.serviceWorker.getRegistration().then((reg) => {
              if (reg) reg.update().catch(() => {});
            });
          }
        });
      }
    </script>
  </body>
</html>
